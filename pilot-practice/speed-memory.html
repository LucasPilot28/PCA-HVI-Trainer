<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}body{margin:0}</style>
<title>Speed and Memory Test</title>
</head>
<body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: test console. Header strip, question navigator on the left, one question card on the right; figures sit on drawn panels like the real test. */
:root{
  --bg:#eef2f5;--surface:#ffffff;--surface-2:#f5f7f9;--ink:#132130;--muted:#566676;--line:#d6dee5;
  --accent:#1d5fa6;--accent-ink:#ffffff;--accent-soft:#e2ecf7;--flag:#a86d00;--flag-soft:#fbf0d9;
  --good:#1f7a45;--good-soft:#e1f1e7;--bad:#b3362c;--bad-soft:#f8e3e0;
  --fig-bg:#ffffff;--fig-stroke:#141a20;--fig-text:#141a20;--fig-frame:#c7d1da;--fig-street:#d7dee4;--fig-block:#eef2f5;--fig-park:#cde6d3;
  --panel:#0c1117;--panel-ink:#f1f5f8;--amber:#f2a516;
  --c-red:#d83b2d;--c-blue:#2d6fd2;--c-yellow:#f0c22e;--c-green:#2f9a55;--c-purple:#7a4fc2;--c-orange:#e8822a;--c-grey:#8d97a3;--radar-bg:#06150c;--radar-ink:#3cc46a;--plate:#b69be6;--plate-edge:#5b3f99;
  --f-display:"Barlow Semi Condensed","Arial Narrow",sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141a;--surface:#151d25;--surface-2:#1b252f;--ink:#e4ebf1;--muted:#93a3b2;--line:#283542;
  --accent:#6aa5e6;--accent-ink:#0b1622;--accent-soft:#1c2c3d;--flag:#e3a63a;--flag-soft:#33280f;
  --good:#5cc68a;--good-soft:#173324;--bad:#ec7a6f;--bad-soft:#3a1d1b;
  --fig-bg:#0f161d;--fig-stroke:#e6edf3;--fig-text:#e6edf3;--fig-frame:#2c3a48;--fig-street:#2c3946;--fig-block:#1a242e;--fig-park:#1d3a27;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141a;--surface:#151d25;--surface-2:#1b252f;--ink:#e4ebf1;--muted:#93a3b2;--line:#283542;
  --accent:#6aa5e6;--accent-ink:#0b1622;--accent-soft:#1c2c3d;--flag:#e3a63a;--flag-soft:#33280f;
  --good:#5cc68a;--good-soft:#173324;--bad:#ec7a6f;--bad-soft:#3a1d1b;
  --fig-bg:#0f161d;--fig-stroke:#e6edf3;--fig-text:#e6edf3;--fig-frame:#2c3a48;--fig-street:#2c3946;--fig-block:#1a242e;--fig-park:#1d3a27;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
.app{max-width:1120px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.15;text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:12px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.top h1{font-size:30px}
.meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.secname{font-size:13px;color:var(--muted);font-weight:500}
.timer{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:18px;background:var(--panel);color:var(--panel-ink);padding:6px 12px;border-radius:6px;min-width:84px;text-align:center}

.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px;align-items:start}
nav{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;display:grid;gap:2px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.navsec{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 10px 4px}
.qbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:7px 10px;cursor:pointer;font-size:14px}
.qbtn:hover:not(:disabled){background:var(--surface-2)}
.qbtn:disabled{cursor:default;color:var(--muted)}
.qbtn .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--line);flex:none}
.qbtn.done .dot{background:var(--accent);border-color:var(--accent)}
.qbtn.cur{background:var(--accent-soft);font-weight:600}
.qbtn.good .dot{background:var(--good);border-color:var(--good)}
.qbtn.bad .dot{background:var(--bad);border-color:var(--bad)}
.qbtn .flagic{margin-left:auto;color:var(--flag)}

main{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px;min-width:0;display:grid;gap:18px}
.qhead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline}
.qhead h2{font-size:24px}
.qhead .sec{font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.chip.flag{background:var(--flag-soft);color:var(--flag)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.prompt{font-size:17px;margin:0;max-width:65ch}
.figwrap{max-width:600px;overflow-x:auto}
.fig{display:block;width:100%;height:auto;max-width:100%}
.fig.small{max-width:300px}

fieldset{border:0;margin:0;padding:0;display:grid;gap:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.opt{display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--line);border-radius:8px;cursor:pointer;max-width:420px;background:var(--surface)}
.opt:hover{border-color:var(--accent)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .box{width:20px;height:20px;border:2px solid var(--muted);border-radius:4px;flex:none;display:grid;place-items:center}
.opt input:checked + .box{background:var(--accent);border-color:var(--accent)}
.opt input:checked + .box::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.opt input:focus-visible + .box{outline:3px solid var(--accent);outline-offset:2px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.mono{font-family:var(--f-mono);letter-spacing:.06em}

.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-top:1px solid var(--line);padding-top:16px}
.actions .spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.flagged{background:var(--flag-soft);border-color:var(--flag);color:var(--flag)}
.btn:disabled{opacity:.45;cursor:default}

.confirm{border:1px solid var(--flag);background:var(--flag-soft);border-radius:8px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.confirm p{margin:0;flex:1 1 240px}

.memo{border:1px dashed var(--line);border-radius:10px;padding:18px;display:grid;gap:12px;justify-items:start;background:var(--surface-2)}
.countbar{height:6px;width:100%;max-width:300px;background:var(--line);border-radius:3px;overflow:hidden}
.countbar i{display:block;height:100%;background:var(--amber);width:100%;animation:drain 5s linear forwards}
@keyframes drain{to{width:0}}
@media (prefers-reduced-motion: reduce){.countbar i{animation:none}}

.intro{display:grid;gap:16px;max-width:68ch}
.intro p{margin:0}
.intro ul{margin:0;padding-left:20px;display:grid;gap:6px}
.secgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.secgrid div{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface-2)}
.secgrid b{display:block;font-family:var(--f-display);font-size:17px}
.secgrid span{font-size:13px;color:var(--muted)}

.score{display:flex;flex-wrap:wrap;gap:12px}
.stat{border:1px solid var(--line);border-radius:10px;padding:12px 16px;min-width:140px;background:var(--surface-2)}
.stat b{display:block;font-family:var(--f-display);font-size:30px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:420px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:14px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.rev{border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px;scroll-margin-top:16px}
.rev.bad{border-left:4px solid var(--bad)}
.rev.good{border-left:4px solid var(--good)}
.rev .ans{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:14px}
.rev .ans b{font-weight:600}
.rev .exp{margin:0;max-width:70ch;color:var(--ink)}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}

@media (max-width:760px){
  .layout{grid-template-columns:minmax(0,1fr)}
  nav{position:static;display:flex;overflow-x:auto;gap:4px}
  .navsec{display:none}
  .qbtn{width:auto;flex:none;white-space:nowrap}
  main{padding:16px}
  .top h1{font-size:25px}
}
</style>

<div class="app">
  <header class="top">
    <div>
      <div class="eyebrow">Practice set · 50 questions</div>
      <h1>Speed and Memory Test</h1>
    </div>
    <div class="meta">
      <span class="secname" id="secname">50 questions · 2 sections</span>
      <span class="timer" id="timer" aria-label="Elapsed time">00:00</span>
    </div>
  </header>
  <div class="layout">
    <nav id="nav" aria-label="Questions"></nav>
    <main id="main" aria-live="polite"></main>
  </div>
</div>

<script>
const f=n=>Math.round(n*10)/10;
const C={R:'var(--c-red)',B:'var(--c-blue)',Y:'var(--c-yellow)',G:'var(--c-green)',P:'var(--c-purple)',O:'var(--c-orange)',T:'var(--c-blue)',M:'var(--c-red)'};
const STK='var(--fig-stroke)',TXT='var(--fig-text)',BG='var(--fig-bg)',PANEL='var(--panel)',PINK='var(--panel-ink)';
const svg=(w,h,label,body,cls='')=>`<svg class="fig ${cls}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${label}">${body}</svg>`;
const frame=(w,h)=>`<rect x="1" y="1" width="${w-2}" height="${h-2}" rx="8" fill="${BG}" stroke="var(--fig-frame)" stroke-width="1.5"/>`;
const lbl=(x,y,t,size=18,fill=TXT)=>`<text x="${x}" y="${y}" text-anchor="middle" font-size="${size}" font-weight="700" fill="${fill}" font-family="Barlow Semi Condensed, Arial Narrow, sans-serif">${t}</text>`;
const txt=(x,y,t,size=13,anchor='middle',fill=TXT,extra='')=>`<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="${size}" font-weight="600" fill="${fill}" font-family="Inter, system-ui, sans-serif" ${extra}>${t}</text>`;
const ABCD='ABCD';

function shp(t,cx,cy,r,fill,hollow,outline){
  const a=hollow?`fill="none" stroke="${hollow===true?fill:hollow}" stroke-width="2.6"`:`fill="${fill}" stroke="${outline?STK:'none'}" stroke-width="${outline?1.5:0}"`;
  if(t==='c')return `<circle cx="${cx}" cy="${cy}" r="${r}" ${a}/>`;
  if(t==='s'){const h=f(r*0.86);return `<rect x="${f(cx-h)}" y="${f(cy-h)}" width="${f(2*h)}" height="${f(2*h)}" ${a}/>`}
  return `<polygon points="${cx},${f(cy-r)} ${f(cx+r*0.95)},${f(cy+r*0.72)} ${f(cx-r*0.95)},${f(cy+r*0.72)}" ${a} stroke-linejoin="round"/>`;
}
function ngon(n,cx,cy,r,rot=0){let p=[];for(let k=0;k<n;k++){const a=(-90+rot+k*360/n)*Math.PI/180;p.push(`${f(cx+r*Math.cos(a))},${f(cy+r*Math.sin(a))}`)}return p.join(' ')}

/* ---------- SRR 1: reflection ---------- */
function reflPanel(x,y,sx,sy){
  const cx=x+30,cy=y+45;
  return `<rect x="${x}" y="${y}" width="60" height="90" fill="${BG}" stroke="${STK}" stroke-width="3"/><g transform="translate(${cx} ${cy}) scale(${sx} ${sy}) translate(${-cx} ${-cy})"><circle cx="${x+16}" cy="${y+17}" r="9" fill="${C.Y}" stroke="${STK}" stroke-width="1.5"/><polygon points="${x+2},${y+88} ${x+58},${y+88} ${x+58},${y+38}" fill="${C.B}"/></g>`;
}
function figRefl(){
  const W=560,H=290;let b=frame(W,H);
  b+=reflPanel(200,14,1,1)+`<line x1="280" y1="6" x2="280" y2="114" stroke="${C.R}" stroke-width="3"/>`;
  b+=`<rect x="300" y="14" width="60" height="90" fill="${BG}" stroke="${STK}" stroke-width="3"/>`+lbl(330,72,'?',36);
  [[-1,1],[-1,-1],[1,-1],[1,1]].forEach((s,i)=>{const x=90+i*110;b+=reflPanel(x,150,...s)+lbl(x+30,270,ABCD[i],20)});
  return svg(W,H,'A panel reflected in a red line, with four options labelled A to D',b);
}

/* ---------- SRR 2: rotation ---------- */
const ORIG=['BRY','GYR','YBG'];
const ROPT=[['YRB','RYG','GBY'],['GBY','RGY','YRB'],['YGB','BYR','GRR'],['GBY','RYG','YRB']];
function grid3(x,y,rows,cell,gap,pad){
  const size=3*cell+2*gap+2*pad;
  let s=`<rect x="${x}" y="${y}" width="${size}" height="${size}" fill="${BG}" stroke="${STK}" stroke-width="3"/>`;
  rows.forEach((row,r)=>[...row].forEach((ch,c)=>{s+=`<rect x="${x+pad+c*(cell+gap)}" y="${y+pad+r*(cell+gap)}" width="${cell}" height="${cell}" fill="${C[ch]}"/>`}));
  return s;
}
function figRot(){
  const W=560,H=338;let b=frame(W,H);
  b+=grid3(213,14,ORIG,34,6,10);
  ROPT.forEach((rows,i)=>{const x=30+i*132;b+=grid3(x,184,rows,26,5,8)+lbl(x+52,320,ABCD[i],22)});
  return svg(W,H,'A 3 by 3 colour grid and four options labelled A to D',b);
}

/* ---------- SRR 3: cube net ---------- */
function isoCube(cx,cy,s,t,l,r){
  const k=f(s*0.866),P=(pts,c)=>`<polygon points="${pts}" fill="${C[c]}" stroke="${STK}" stroke-width="2.5" stroke-linejoin="round"/>`;
  return P(`${cx},${cy-s} ${cx+k},${cy-s/2} ${cx},${cy} ${cx-k},${cy-s/2}`,t)
    +P(`${cx-k},${cy-s/2} ${cx},${cy} ${cx},${cy+s} ${cx-k},${cy+s/2}`,l)
    +P(`${cx},${cy} ${cx+k},${cy-s/2} ${cx+k},${cy+s/2} ${cx},${cy+s}`,r);
}
function figCube(){
  const W=560,H=356,s=46,x0=188,y0=18;let b=frame(W,H);
  const sq=(c,r,col)=>`<rect x="${x0+c*s}" y="${y0+r*s}" width="${s}" height="${s}" fill="${C[col]}" stroke="${STK}" stroke-width="2.5"/>`;
  b+=sq(2,0,'P')+sq(3,0,'G')+sq(0,1,'B')+sq(1,1,'R')+sq(2,1,'Y')+sq(0,2,'O');
  const opts=[['Y','B','R'],['G','P','Y'],['G','Y','P'],['P','R','O']];
  opts.forEach((o,i)=>{const cx=80+i*133;b+=isoCube(cx,252,44,...o)+lbl(cx,338,ABCD[i],22)});
  return svg(W,H,'Cube net with six coloured faces, and four cubes labelled A to D',b);
}

/* ---------- SRR 4: named street map ---------- */
function figMap(){
  const W=460,H=390;let b=frame(W,H);const st='var(--fig-street)';
  [80,220,360].forEach(x=>b+=`<rect x="${x-12}" y="36" width="24" height="288" fill="${st}"/>`);
  [60,180,300].forEach(y=>b+=`<rect x="56" y="${y-12}" width="328" height="24" fill="${st}"/>`);
  const sl=(x,y,t,rot)=>`<text x="${x}" y="${y}" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--muted)" font-family="Inter, system-ui, sans-serif" ${rot?`transform="rotate(-90 ${x} ${y})"`:''}>${t}</text>`;
  b+=sl(150,64,'North Street')+sl(290,64,'North Street')+sl(150,184,'Bridge Street')+sl(290,184,'Bridge Street')+sl(150,304,'South Street')+sl(290,304,'South Street');
  b+=sl(84,120,'West Road',1)+sl(84,240,'West Road',1)+sl(224,120,'Mill Lane',1)+sl(224,240,'Mill Lane',1)+sl(364,120,'East Road',1)+sl(364,240,'East Road',1);
  const box=(x,y,w,h,name,fill)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="${fill||'var(--fig-block)'}" stroke="${STK}" stroke-width="1.3"/>`+txt(x+w/2,y+h/2+5,name,13.5);
  b+=box(96,76,52,88,'Library')+box(152,76,52,88,'Café');
  b+=box(236,76,52,88,'Cinema')+box(292,76,52,88,'Hotel');
  b+=box(96,196,108,88,'Park','var(--fig-park)');
  b+=box(236,196,52,88,'School')+box(292,196,52,88,'Pool');
  b+=`<polygon points="118,300 98,292 98,308" fill="var(--amber)" stroke="${STK}" stroke-width="1.2"/>`;
  b+=`<line x1="430" y1="78" x2="430" y2="50" stroke="${STK}" stroke-width="2.5"/><polygon points="430,40 423,54 437,54" fill="${STK}"/>`+lbl(430,98,'N',18);
  return svg(W,H,'Street map with named roads and buildings',b);
}

/* ---------- SRR 5: odd plate ---------- */
function plate(cx,cy,rot,mirror){
  const inner=`<rect x="-34" y="-34" width="68" height="68" rx="3" fill="var(--plate)" stroke="var(--plate-edge)" stroke-width="2"/><circle cx="-16" cy="-16" r="8" fill="${BG}" stroke="var(--plate-edge)" stroke-width="1.5"/><rect x="0" y="13" width="24" height="8" rx="2" fill="${BG}" stroke="var(--plate-edge)" stroke-width="1.5"/>`;
  const t=`translate(${cx} ${cy}) rotate(${rot})${mirror?' scale(-1 1)':''}`;
  return `<g transform="translate(5 6)"><g transform="${t}"><rect x="-34" y="-34" width="68" height="68" rx="3" fill="var(--plate-edge)"/></g></g><g transform="${t}">${inner}</g>`;
}
function figPlates(){
  const W=560,H=200;let b=frame(W,H);
  [[25,0],[150,0],[70,1],[250,0]].forEach((p,i)=>{const cx=80+i*133;b+=plate(cx,86,...p)+lbl(cx,182,ABCD[i],20)});
  return svg(W,H,'Four square plates, each with a round hole and a slot, labelled A to D',b);
}

/* ---------- radar helpers ---------- */
function radarBase(cx,cy,R){
  let s=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="var(--radar-bg)" stroke="var(--radar-ink)" stroke-width="2"/>`;
  [1/3,2/3].forEach(k=>s+=`<circle cx="${cx}" cy="${cy}" r="${f(R*k)}" fill="none" stroke="var(--radar-ink)" stroke-opacity=".45"/>`);
  s+=`<line x1="${cx-R}" y1="${cy}" x2="${cx+R}" y2="${cy}" stroke="var(--radar-ink)" stroke-opacity=".35"/><line x1="${cx}" y1="${cy-R}" x2="${cx}" y2="${cy+R}" stroke="var(--radar-ink)" stroke-opacity=".35"/>`;
  return s;
}
const contact=(x,y,r=5)=>`<circle cx="${f(x)}" cy="${f(y)}" r="${r}" fill="${C.R}" stroke="#fff" stroke-width="1"/>`;

/* ---------- SRR 6: radar crossing ---------- */
function figCross(){
  const W=300,H=300;let b=`<rect x="0" y="0" width="${W}" height="${H}" rx="8" fill="var(--radar-bg)"/>`+radarBase(150,150,120);
  b+=`<line x1="60" y1="220" x2="80" y2="200" stroke="${C.R}" stroke-width="3" stroke-opacity=".55" stroke-linecap="round"/>`+contact(80,200,6);
  b+=`<line x1="232" y1="234" x2="220" y2="210" stroke="${C.R}" stroke-width="3" stroke-opacity=".55" stroke-linecap="round"/>`+contact(220,210,6);
  [[200,140],[120,80],[170,110],[140,120]].forEach(([x,y],i)=>{b+=`<path d="M${x-5},${y-5} L${x+5},${y+5} M${x-5},${y+5} L${x+5},${y-5}" stroke="#fff" stroke-width="2"/>`+lbl(x+12,y-6,ABCD[i],15,'#fff')});
  return svg(W,H,'Radar with two contacts and their trails, and four candidate crossing points A to D',b,'small');
}

/* ---------- Abstract 1: shapes per box ---------- */
const AODD=[{n:4,rs:[16,12,14,10]},{n:3,rs:[15,11,17]},{n:5,rs:[12,15,10,13,11]},{n:5,rs:[14,11,16,12],count:4}];
function figAOdd(){

function gStatus(){const col=Array.from({length:30},()=>pick('RGB')).join(''),st=Array.from({length:30},()=>pick('TX')).join(''),n=ri(1,30),CN={R:'red',G:'green',B:'blue'},nm=k=>`${st[k]==='T'?'Tick':'Cross'}, ${CN[col[k]]}`;

  const CN={R:'red',G:'green',B:'blue',Y:'yellow',P:'purple',O:'orange'},SN={t:'triangle',c:'circle',s:'square'};const vs=new Map();let g=0;

/* ---- build: 25 PSA then 25 WM, types mixed within each section ---- */
shuf([...Array(5).fill(gSeq),...Array(4).fill(gASI),...Array(4).fill(gHDG),...Array(4).fill(gScene),...Array(4).fill(gFind),...Array(4).fill(gStatus)]).forEach(f=>f());

const SECS=[...new Set(Q.map(q=>q.sec))];
const PACE=25,SLOW=45;

let view='intro',cur=0,ans=Array(Q.length).fill(null),flags=new Set(),spent=Array(Q.length).fill(0),memo=Array(Q.length).fill('idle');
let t0=0,tick=null,total=0,enteredAt=0,memoTimer=null,confirming=false,onlyMisses=false;
const $=id=>document.getElementById(id);
const fmt=s=>{s=Math.round(s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const flagSvg='<svg class="flagic" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1v12M3 2h8l-2 3 2 3H3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>';
const canSpeak=()=>{try{return 'speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined'}catch(e){return false}};

function renderNav(){
  let h='',last='';
  Q.forEach((q,i)=>{
    if(q.sec!==last){h+=`<div class="navsec">${q.sec}</div>`;last=q.sec}
    let cls='';
    if(view==='results')cls=ans[i]===q.ans?'good':'bad';
    else{if(ans[i]!=null)cls+=' done';if(view==='q'&&i===cur)cls+=' cur'}
    h+=`<button class="qbtn ${cls}" data-i="${i}" ${view==='intro'?'disabled':''}><span class="dot"></span>Question ${i+1}${flags.has(i)?flagSvg:''}</button>`;
  });
  $('nav').innerHTML=h;
}

function renderIntro(){
  $('secname').textContent='50 questions · 2 sections';
  const counts=SECS.map(s=>`<div><b>${s}</b><span>${Q.filter(q=>q.sec===s).length} questions</span></div>`).join('');
  $('main').innerHTML=`<div class="intro">
    <h2 style="font-size:26px">Before you start</h2>
    <p>A focused drill on the two timed sections: 25 Perceptual Speed and Accuracy questions, then 25 Working Memory questions, in the same formats as the practice test. Every visit generates a new set (this is set ${SEED%100000}); reload the page for a fresh one.</p>
    <div class="secgrid">${counts}</div>
    <ul>
      <li>Aim for about ${PACE} seconds per question, roughly 21 minutes in total. The timer runs from the moment you start.</li>
      <li>In Perceptual Speed and Accuracy your first answer is locked, as in the real test, so be sure before you click.</li>
      <li>Working Memory images show once, for 5 seconds. Three questions play a short audio clip once, so turn your sound on.</li>
      <li>You can flag questions and move between them. Answers and explanations appear only after you press Finish.</li>
    </ul>
    <div><button class="btn primary" id="start">Start test</button></div>
  </div>`;
  $('start').onclick=start;
}

function start(){
  view='q';cur=0;t0=Date.now();clearInterval(tick);
  tick=setInterval(()=>{$('timer').textContent=fmt((Date.now()-t0)/1000)},1000);
  enter(0);
}
function stopAudio(){try{if(canSpeak())speechSynthesis.cancel()}catch(e){}}
function leave(){
  if(view!=='q')return;
  spent[cur]+=(Date.now()-enteredAt)/1000;
  if(memo[cur]==='showing'){clearTimeout(memoTimer);memo[cur]='done';stopAudio()}
}
function enter(i){cur=i;enteredAt=Date.now();confirming=false;render();window.scrollTo({top:0})}
function goTo(i){leave();enter(i)}

function renderQ(){
  const q=Q[cur],i=cur,audio=q.audio&&canSpeak();
  $('secname').textContent=q.sec;
  let body='';
  if(q.memo&&memo[i]==='idle'){
    body=audio?`<div class="memo"><p class="prompt" style="font-size:15px">Listen to the audio clip. It plays once, then the question appears.</p><button class="btn primary" id="showmemo">Play audio</button></div>`
      :`<div class="memo"><p class="prompt" style="font-size:15px">Memorise the ${q.audio?'sequence':'image'}. It appears once, for 5 seconds, then the question appears.</p><button class="btn primary" id="showmemo">Show ${q.audio?'sequence':'image'}</button></div>`;
  }else if(q.memo&&memo[i]==='showing'){
    body=audio?`<div class="memo"><span class="chip flag">Playing audio…</span></div>`
      :`<div class="memo"><div class="figwrap">${q.fig()}</div><div class="countbar"><i></i></div><span class="chip" id="memoleft">5 s left</span></div>`;
  }else{
    const fig=q.memo?(q.after?`<div class="figwrap">${q.after()}</div>`:''):(q.fig?`<div class="figwrap">${q.fig()}</div>`:'');
    const locked=q.lock&&ans[i]!=null;
    const note=(q.memo?`<span class="chip">The ${q.audio?'clip has':'image has'} been hidden</span> `:'')+(q.lock?`<span class="chip${locked?' flag':''}">${locked?'Answer locked':'Your first answer is final'}</span>`:'');
    const opts=q.opts.map((o,j)=>`<label class="opt ${ans[i]===o?'sel':''}" for="q${i}-o${j}"><input type="radio" name="q${i}" id="q${i}-o${j}" value="${esc(o)}" ${ans[i]===o?'checked':''} ${locked?'disabled':''}><span class="box"></span><span class="${q.mono?'mono':''}">${esc(o)}</span></label>`).join('');
    body=`${note?`<div>${note}</div>`:''}<p class="prompt">${q.prompt}</p>${fig}<fieldset><legend class="sr">Answer options</legend>${opts}</fieldset>`;
  }
  const unanswered=ans.filter(a=>a==null).length;
  const conf=confirming?`<div class="confirm"><p>${unanswered?`You have ${unanswered} unanswered question${unanswered>1?'s':''}. `:''}Finish the test and see your results?</p><button class="btn" id="keep">Keep going</button><button class="btn primary" id="dofinish">Finish test</button></div>`:'';
  $('main').innerHTML=`<div class="qhead"><h2>Question ${i+1} <span style="color:var(--muted);font-weight:600">of ${Q.length}</span></h2><span class="sec">${q.sec}</span>${flags.has(i)?'<span class="chip flag">Flagged</span>':''}</div>
    ${body}

}

function finish(){
  leave();stopAudio();total=(Date.now()-t0)/1000;clearInterval(tick);$('timer').textContent=fmt(total);

function renderResults(){
  $('secname').textContent='Results';
  const right=Q.filter((q,i)=>ans[i]===q.ans).length;
  const rows=SECS.map(s=>{const idx=Q.map((q,i)=>i).filter(i=>Q[i].sec===s);const ok=idx.filter(i=>ans[i]===Q[i].ans).length;const avg=idx.reduce((a,i)=>a+spent[i],0)/idx.length;
    return `<tr><td>${s}</td><td>${ok} / ${idx.length}</td><td>${Math.round(ok/idx.length*100)}%</td><td>${avg.toFixed(1)} s</td></tr>`}).join('');
  const slow=spent.filter(s=>s>SLOW).length;
  const cards=Q.map((q,i)=>{
    const ok=ans[i]===q.ans,un=ans[i]==null;
    if(onlyMisses&&ok)return '';
    const chip=ok?'<span class="chip good">Correct</span>':un?'<span class="chip bad">Unanswered</span>':'<span class="chip bad">Incorrect</span>';
    const t=spent[i]>SLOW?`<span class="chip flag">${spent[i].toFixed(1)} s · slow</span>`:`<span class="chip">${spent[i].toFixed(1)} s</span>`;
    let fig='';
    if(q.fig)fig=`<div class="figwrap">${q.memo?`<p style="margin:0 0 6px;font-size:13px;color:var(--muted)">${q.audio?'What the audio said':'The image you memorised'}</p>`:''}${q.fig()}</div>`;
    if(q.after)fig+=`<div class="figwrap"><p style="margin:0 0 6px;font-size:13px;color:var(--muted)">What you compared it with</p>${q.after()}</div>`;
    return `<article class="rev ${ok?'good':'bad'}" id="rev-${i}"><div class="qhead"><h3 style="font-size:20px">Question ${i+1}</h3><span class="sec">${q.sec}</span>${chip}${t}</div>
      <p class="prompt" style="font-size:16px">${q.prompt}</p>${fig}
      <div class="ans"><span>Your answer: <b class="${q.mono?'mono':''}">${un?'none':esc(ans[i])}</b></span><span>Correct: <b class="${q.mono?'mono':''}">${esc(q.ans)}</b></span></div>
      <p class="exp">${q.exp}</p></article>`}).join('');
  $('main').innerHTML=`<div class="qhead"><h2>Your results</h2></div>
    <div class="score">
      <div class="stat"><b>${Math.round(right/Q.length*100)}%</b><span>${right} of ${Q.length} correct</span></div>
      <div class="stat"><b>${fmt(total)}</b><span>total time</span></div>
      <div class="stat"><b>${(total/Q.length).toFixed(1)} s</b><span>average per question</span></div>
      <div class="stat"><b>${slow}</b><span>question${slow===1?'':'s'} over ${SLOW} s</span></div>
    </div>
    <div class="tablewrap"><table><thead><tr><th>Section</th><th>Correct</th><th>Score</th><th>Avg reaction time</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="actions" style="border-top:0;padding-top:0"><label class="toggle" for="misses"><input type="checkbox" id="misses" ${onlyMisses?'checked':''}> Show only questions to review</label><span class="spacer"></span><button class="btn" id="retake">Retake test</button></div>
    ${cards||'<p>Every answer was correct.</p>'}`;
  $('misses').onchange=e=>{onlyMisses=e.target.checked;renderResults()};
  $('retake').onclick=()=>{view='intro';ans=Array(Q.length).fill(null);flags=new Set();spent=Array(Q.length).fill(0);memo=Array(Q.length).fill('idle');onlyMisses=false;$('timer').textContent='00:00';render();window.scrollTo({top:0})};
}

function render(){renderNav();if(view==='intro')renderIntro();else if(view==='q')renderQ();else renderResults()}

$('nav').addEventListener('click',e=>{const b=e.target.closest('.qbtn');if(!b||b.disabled)return;const i=+b.dataset.i;
  if(view==='q')goTo(i);else if(view==='results'){const el=$('rev-'+i);if(el)el.scrollIntoView({behavior:'smooth'})}});
render();
</script>

</body>
</html>
